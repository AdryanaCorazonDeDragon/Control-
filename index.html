<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Definitivo QN85B</title>
    <!-- Vinculamos tu archivo CSS (asumiendo que se llama styles.css) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="control-container">
        <!-- Segmento Superior -->
        <div class="segmento-superior">
            <button class="btn btn-power" onclick="enviarComando('KEY_POWER')">On</button>
            
            <!-- ESTE ES EL BOTÓN DE LA IP QUE TE FALTA -->
            <!-- Al hacerle clic, llama a la función configurarIP() de tu JavaScript -->
            <button id="btn-status" class="btn btn-status-desconectado" onclick="configurarIP()">🔴 IP</button>
            
            <button class="btn btn-reconectar" onclick="forzarReconexion()">Reconectar</button>
        </div>

        <!-- Segmento Matriz (Volumen y Canales) -->
        <div class="segmento-matriz">
            <button class="btn" onclick="enviarComando('KEY_VOLUP')">VOL +</button>
            <button class="btn" onclick="enviarComando('KEY_MUTE')">MUTE</button>
            <button class="btn" onclick="enviarComando('KEY_CHUP')">CH▲</button>
            <button class="btn" onclick="enviarComando('KEY_VOLDOWN')">VOL -</button>
            <button class="btn" onclick="enviarComando('KEY_MENU')">MENU</button>
            <button class="btn" onclick="enviarComando('KEY_CHDOWN')">CH▼</button>
        </div>

        <!-- Segmento Intermedio (Smart Menu y Atrás) -->
        <div class="segmento-intermedio">
            <button class="btn btn-home" onclick="enviarComando('KEY_HOME')">Smart Menu</button>
            <button class="btn btn-back" onclick="enviarComando('KEY_RETURNS')">↩ Back</button>
        </div>

        <!-- Segmento Touch (Panel Táctil) -->
        <div class="segmento-touch">
            <div id="touchpad" class="touchpad-area">
                <span class="touchpad-label">PANEL TÁCTIL</span>
            </div>
        </div>
    </div>

    <!-- Vinculamos tu archivo JavaScript (asumiendo que se llama script.js) -->
    <!-- DEBE IR AL FINAL DEL BODY para que encuentre los ID "btn-status" y "touchpad" -->
    <script src="script.js"></script>
</body>
</html>
